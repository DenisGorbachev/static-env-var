[workspace]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85.0"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/DenisGorbachev/static-env-var"
repository = "https://github.com/DenisGorbachev/static-env-var"
keywords = []
categories = []
exclude = [
    ".*",
    "*.local.*",
    "doc/dev",
    "specs",
    "AGENTS.ts",
    "CargoMetadata.ts",
    "README.ts",
    "AGENTS*.md",
    "CLAUDE*.md",
    "deno.lock",
    "deno.json",
    "commitlint.config.mjs",
    "fnox.toml",
    "mise.toml",
    "rumdl.toml",
    "rustfmt.toml",
    ".yolobox"
]

[workspace.metadata.details]
name = "static-env-var"
title = "static-env-var"
readme = { generate = true }

[workspace.lints.rust]
redundant_imports = "deny"
unused_import_braces = "deny"
# unused_qualifications must not be "deny" because our code style has multiple `use Foo::*;`, and some macros (derive_more::Display, strum::Display, strum::EnumString) produce code with full qualifications
# unused_qualifications = "deny"

[workspace.lints.clippy]
absolute_paths = "deny"
arithmetic_side_effects = "deny"

[package]
name = "static-env-var"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A macro for loading the env vars statically in a `LazyLock`."
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[package.metadata.details]
title = "static-env-var"

[lints]
workspace = true

[dependencies]
